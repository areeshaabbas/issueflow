name: IssueFlow checks
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: issueflow
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: issueflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U issueflow"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
        working-directory: backend
      - run: python -m pytest -q
        working-directory: backend
      - name: PostgreSQL smoke test
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://issueflow:testpassword@localhost:5432/issueflow
          JWT_SECRET: ci-only-random-testing-secret-123456789
        run: python postgres_smoke.py
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
  docker:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the local stack
        env:
          POSTGRES_PASSWORD: ci-only-postgres-password
          JWT_SECRET: ci-only-jwt-secret-at-least-32-characters
        run: docker compose up --build --wait --wait-timeout 180
      - name: Check frontend and API through nginx
        run: |
          curl --fail --retry 10 --retry-connrefused --retry-delay 2 http://localhost:8080/ | grep -q 'Team issue tracker'
          curl --fail http://localhost:8080/api/health | grep -q 'ok'
      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --no-color
        env:
          POSTGRES_PASSWORD: ci-only-postgres-password
          JWT_SECRET: ci-only-jwt-secret-at-least-32-characters
      - name: Remove disposable test containers
        if: always()
        run: docker compose down --volumes
        env:
          POSTGRES_PASSWORD: ci-only-postgres-password
          JWT_SECRET: ci-only-jwt-secret-at-least-32-characters
